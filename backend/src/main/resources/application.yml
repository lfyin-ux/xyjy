server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: xyjy-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xyjy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: null

# 文件上传保存目录 项目根目录下uploads文件夹
file:
  upload-dir: ../uploads
  access-prefix: /uploads

# 微信小程序配置
wechat:
  # 正式AppID和AppSecret 注册后填入
  app-id: wx13b60dd991c5b29e
  app-secret: your_app_secret_here
  # 微信内容安全 msg_sec_check
  sec-check:
    enabled: true

# 微信支付配置（APIv3）
wxpay:
  # 商户号
  mch-id: your_mch_id_here
  # APIv3 密钥（商户平台 → API安全 → 设置APIv3密钥，32位）
  api-v3-key: your_api_v3_key_here
  # 商户API证书序列号（商户平台 → API安全 → 查看证书）
  merchant-serial-number: your_merchant_serial_number_here
  # 商户API私钥文件路径（apiclient_key.pem）
  private-key-path: ../certs/apiclient_key.pem
  # 微信支付公钥 ID（商户平台 → API安全 → 微信支付公钥 → 下载后可见）
  public-key-id: your_public_key_id_here
  # 微信支付公钥文件路径（pub_key.pem，不是 apiclient_cert.pem）
  public-key-path: ../certs/pub_key.pem
  # 支付结果回调地址
  notify-url: https://tongxingshikong.cn/api/pay/notify

# 阿里云金融级实人认证（ID_MIN 照片核身）
aliyun:
  cloudauth:
    access-key-id: ${ALIYUN_CLOUDAUTH_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_CLOUDAUTH_ACCESS_KEY_SECRET:}
    scene-id: ${ALIYUN_CLOUDAUTH_SCENE_ID:1000021483}

# 应用模式 dev开发模式 prod生产模式
app:
  mode: dev

# 短信服务配置 支持阿里云短信
sms:
  # 是否启用真实短信 false 时使用测试验证码 123456
  enabled: false
  # 阿里云AccessKeyId
  access-key-id: your_access_key_id
  # 阿里云AccessKeySecret
  access-key-secret: your_access_key_secret
  # 短信签名（与阿里云签名管理中的名称完全一致）
  sign-name: 内蒙古因源果网络科技服务有限公司
  # 验证码模板编号
  template-code: SMS_512095649
  # 验证码有效期（分钟）
  code-expire-minutes: 5
