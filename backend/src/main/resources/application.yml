server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: xyjy-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xyjy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: null

# 文件上传保存目录 项目根目录下uploads文件夹
file:
  upload-dir: ../uploads
  access-prefix: /uploads

# 微信小程序配置
wechat:
  # 正式AppID和AppSecret 注册后填入
  app-id: wx13b60dd991c5b29e
  app-secret: your_app_secret_here
  # 微信内容安全 msg_sec_check
  sec-check:
    enabled: true

# 微信支付配置
wxpay:
  # 商户号
  mch-id: your_mch_id_here
  # API密钥（V2）
  api-key: your_api_key_here
  # 支付结果回调地址 部署后改为正式域名
  notify-url: https://your-domain.com/api/pay/notify

# 应用模式 dev开发模式 prod生产模式
app:
  mode: dev

# 短信服务配置 支持阿里云短信
sms:
  # 是否启用真实短信 false 时使用测试验证码 123456
  enabled: false
  # 阿里云AccessKeyId
  access-key-id: your_access_key_id
  # 阿里云AccessKeySecret
  access-key-secret: your_access_key_secret
  # 短信签名（与阿里云签名管理中的名称完全一致）
  sign-name: 内蒙古因源果网络科技服务有限公司
  # 验证码模板编号
  template-code: SMS_512095649
